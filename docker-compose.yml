version: '3.8'

services:
  # PostgreSQL for Hindsight (Hindsight manages its own DB)
  # We'll use Hindsight's own docker-compose for the memory service
  # This compose file runs RECALL-X backend + frontend only
  # Hindsight should be started separately via its own docker-compose

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recall-x-backend
    ports:
      - "8001:8001"
    environment:
      - HINDSIGHT_API_URL=http://host.docker.internal:8000
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_BANK_ID=recall-x-experiments
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - DEBUG=true
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recall-x-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: recall-x-network